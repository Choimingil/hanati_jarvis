services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: hanati-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  elastic-init:
    image: python:3.11-slim
    container_name: hanati-elastic-init
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=
      - ELASTICSEARCH_VERIFY_CERTS=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/elastic/requirements.txt && \
      python -m elastic.main && \
      python -m elastic.mapping && \
      python -m elastic.seed_cases"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hanati-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  qdrant-init:
    image: python:3.11-slim
    container_name: hanati-qdrant-init
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=incident_cases
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - EMBEDDING_VECTOR_SIZE=1024
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/qdrant/requirements.txt && \
      python -m qdrant.seed"
    restart: "no"

  log-generator:
    image: python:3.11-slim
    container_name: hanati-log-generator
    working_dir: /workspace
    volumes:
      - .:/workspace
      - log-volume:/workspace/fluentbit
    environment:
      - PYTHONPATH=/workspace/log_generator:/workspace
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/log_generator/requirements.txt && \
      python /workspace/log_generator/main.py"
    restart: "no"

  fluent-bit:
    image: fluent/fluent-bit:latest
    # routes/log_generator_routes.py의 FLUENTBIT_CONTAINER, dev_infra.sh와
    # 동일한 이름으로 맞춘다(웹 콘솔 activity 로그 조회가 이 이름을 쓴다).
    container_name: hanati-fluentbit
    volumes:
      - ./fluentbit:/fluent-bit/etc
      - log-volume:/var/log/app
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    depends_on:
      - log-generator
      - aiops
    # fluent-bit.conf의 OUTPUT은 `Host host.docker.internal:8080`으로 보낸다.
    # 이 이름은 aiops 서비스에 네트워크 alias로 붙여 두었으므로(아래 aiops
    # 참고), compose 네트워크 안에서 곧바로 aiops 컨테이너의 8080으로 해석된다.
    # 호스트 게시 포트(run_app.sh와 겹치지 않게 18080으로 옮김)와 무관하게
    # 컨테이너-투-컨테이너로 도달한다.

  collector:
    image: python:3.11-slim
    container_name: hanati-collector
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - METRICS_API_URL=http://aiops:8080/api/v1/metrics
      - METRICS_COLLECT_INTERVAL_SECONDS=30
      - METRICS_PROCESS_LIMIT=20
    depends_on:
      - aiops
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/collector/requirements.txt && \
      python -m collector.agent --url http://aiops:8080/api/v1/metrics --interval 30"
    restart: "no"

  # NOTE: llm_agent는 별도 HTTP 서비스가 아니라 aiops가 인프로세스로
  # import해 쓰는 라이브러리다(adapters/llm_adapters.py -> LLMService).
  # LLM 호출은 aiops가 OPENAI_* 설정으로 직접 나가므로 별도 llm-agent
  # 컨테이너(8000)는 데이터 경로 밖이라 두지 않는다.
  aiops:
    image: python:3.11-slim
    container_name: hanati-aiops
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - LOG_REPOSITORY_BACKEND=elastic
      - CASE_SEARCHER_BACKEND=elastic
      - RECOMMENDATION_BACKEND=llm
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=incident_cases
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - EMBEDDING_VECTOR_SIZE=1024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # 호스트 게시 포트는 18080. 호스트에서 직접 돌리는 run_app.sh(기본 8080)와
    # 겹치지 않게 하기 위함이다. 컨테이너 내부는 그대로 8080이고, compose
    # 내부 서비스(collector/fluent-bit)는 서비스명:8080으로 접근하므로 영향 없다.
    # 풀 도커 모드에서 웹 콘솔은 http://localhost:18080/ 로 접속한다.
    ports:
      - "18080:8080"
    # compose 안의 fluent-bit이 fluent-bit.conf의 `host.docker.internal`로
    # aiops에 곧바로 도달하도록 이 이름을 aiops의 네트워크 alias로 붙인다.
    networks:
      default:
        aliases:
          - host.docker.internal
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/aiops/requirements.txt && \
      python /workspace/app.py"
    restart: "no"

volumes:
  elastic-data:
  qdrant-data:
  log-volume:
