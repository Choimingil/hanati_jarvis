services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: hanati-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  elastic-init:
    image: python:3.11-slim
    container_name: hanati-elastic-init
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_USER=elastic
      - ELASTICSEARCH_PASSWORD=
      - ELASTICSEARCH_VERIFY_CERTS=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/elastic/requirements.txt && \
      python -m elastic.main && \
      python -m elastic.mapping && \
      python -m elastic.seed_cases"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: hanati-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /healthz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  qdrant-init:
    image: python:3.11-slim
    container_name: hanati-qdrant-init
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=incident_cases
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - EMBEDDING_VECTOR_SIZE=1024
    depends_on:
      qdrant:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/qdrant/requirements.txt && \
      python -m qdrant.seed"
    restart: "no"

  log-generator:
    image: hanati-log-generator:local
    build:
      context: .
      dockerfile: log_generator/Dockerfile
    container_name: hanati-log-generator
    working_dir: /workspace
    volumes:
      - .:/workspace
      - log-volume:/workspace/fluentbit
    environment:
      - PYTHONPATH=/workspace/log_generator:/workspace
    command: ["python", "/workspace/log_generator/main.py"]
    restart: "no"

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: hanati-fluent-bit
    volumes:
      - ./fluentbit:/fluent-bit/etc
      - log-volume:/var/log/app
    command: ["-c", "/fluent-bit/etc/fluent-bit.conf"]
    depends_on:
      - log-generator
    ports:
      - "9880:9880"

  collector:
    image: python:3.11-slim
    container_name: hanati-collector
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - METRICS_API_URL=http://aiops:8080/api/v1/metrics
      - METRICS_COLLECT_INTERVAL_SECONDS=30
      - METRICS_PROCESS_LIMIT=20
    depends_on:
      - aiops
    command: >
      sh -c "pip install --no-cache-dir -r /workspace/collector/requirements.txt && \
      python -m collector.agent --url http://aiops:8080/api/v1/metrics --interval 30"
    restart: "no"

  llm-agent:
    image: hanati-llm-agent:local
    build:
      context: .
      dockerfile: llm_agent/Dockerfile
    container_name: hanati-llm-agent
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "llm_agent.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: "no"

  aiops:
    image: hanati-aiops:local
    build:
      context: .
      dockerfile: aiops/Dockerfile
    container_name: hanati-aiops
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - LOG_REPOSITORY_BACKEND=elastic
      - CASE_SEARCHER_BACKEND=elastic
      - RECOMMENDATION_BACKEND=llm
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=incident_cases
      - EMBEDDING_MODEL_NAME=BAAI/bge-m3
      - EMBEDDING_VECTOR_SIZE=1024
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-30}
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-agent:
        condition: service_started
    ports:
      - "8080:8080"
    command: ["python", "/workspace/app.py"]
    restart: "no"

volumes:
  elastic-data:
  qdrant-data:
  log-volume:
