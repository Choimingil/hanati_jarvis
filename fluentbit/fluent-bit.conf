[SERVICE]
    Flush         5
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parser.conf

[INPUT]
    Name              tail
    Path              /var/log/app/application.log
    Tag               myapp.log
    Parser            app_json

    Read_From_Head    Off
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     20MB

[FILTER]
    Name              modify
    Match             myapp.log
    Add               application order-service
    Add               environment production

[OUTPUT]
    Name              http
    Match             myapp.log

    Host              host.docker.internal
    Port              8080
    URI               /api/v1/logs
    Format            json

    Header            Content-Type application/json
    Retry_Limit       5
    # 응답 본문(각 로그별 status/reason)을 매 flush마다 그대로 찍으면
    # level != ERROR 로그가 대부분이라 "log level is not ERROR" 메시지가
    # 컨테이너 로그를 뒤덮는다(log_processor.py:49). "HTTP status=200"
    # 줄은 Log_Response_Payload와 무관하게 flush마다 항상 찍혀서 여전히
    # 파이프라인이 살아있다는 근거가 되므로, 본문 로깅만 끈다.
    Log_Response_Payload Off

[OUTPUT]
    # 위 http 출력은 백엔드로의 전송 결과(HTTP status)만 보여준다.
    # log_generator가 실제로 무엇을 썼고 fluent-bit가 무엇을 집어서
    # 넘기는 중인지(tail 자체가 살아있는지)는 이게 있어야 컨테이너
    # 로그에서 바로 보인다.
    Name              stdout
    Match             myapp.log
    Format            json_lines
