name: Deploy to EC2

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /opt/jarvis

            git -c safe.directory=/opt/jarvis fetch origin master
            git -c safe.directory=/opt/jarvis checkout -B master origin/master
            git -c safe.directory=/opt/jarvis reset --hard origin/master

            echo "Deployed commit:"
            git -c safe.directory=/opt/jarvis log -1 --oneline

            docker compose up -d --build --no-deps --force-recreate aiops

            docker compose ps aiops

            echo "Health check:"
            curl -fsS http://127.0.0.1:8080/health
